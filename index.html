<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ספרים">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>ספרים מושמעים</title>
<style>
  :root {
    --bg: #f6f3ee; --card: #fffdf9; --ink: #1d1b18; --muted: #7a736b; --line: #e7e1d8;
    --accent: #1f5f8b; --accent-ink: #fff; --soft: #efe9e0; --danger: #b3261e;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.07);
    --font: -apple-system, "SF Hebrew", "Heebo", system-ui, sans-serif;
    --top: env(safe-area-inset-top); --bottom: env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161412; --card: #211e1b; --ink: #f1ece5; --muted: #a39b91; --line: #34302b;
      --accent: #6aa9d6; --accent-ink: #0d1a24; --soft: #2a2622; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
  body { padding-top: var(--top); min-height: 100dvh; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px calc(110px + var(--bottom)); }

  /* header */
  .top { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; }
  .top h1 { font-size: 30px; font-weight: 800; margin: 0; flex: 1; letter-spacing: -.3px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); }
  .icon-btn:active { background: var(--soft); }
  .back { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; padding: 12px 0 6px; }

  /* library */
  .section { font-size: 13px; font-weight: 700; color: var(--muted); margin: 18px 4px 8px; }
  .list { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; width: 100%; text-align: start; }
  .row + .row { border-top: 1px solid var(--line); }
  .row:active { background: var(--soft); }
  .row .meta { flex: 1; min-width: 0; }
  .row .title { font-weight: 650; font-size: 16.5px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .bar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 7px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .play-chip { width: 38px; height: 38px; border-radius: 50%; background: var(--soft); color: var(--accent); display: grid; place-items: center; flex: none; }

  /* generated covers */
  .cover { flex: none; border-radius: 6px; display: grid; place-items: center; text-align: center; color: #fff; font-weight: 800;
    overflow: hidden; position: relative; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .cover span { padding: 10%; line-height: 1.15; text-shadow: 0 1px 2px rgba(0,0,0,.25); overflow-wrap: anywhere; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover.shape-square img { object-position: top; }
  .cover:has(img) { background: var(--soft); }

  /* book page */
  .book-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 8px 0 18px; }
  .book-head .cover { border-radius: 10px; box-shadow: var(--shadow); }
  .book-head h2 { font-size: 23px; margin: 6px 0 0; line-height: 1.25; }
  .book-head .sub { color: var(--muted); font-size: 14px; }
  .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 360px; min-height: 52px; border-radius: 14px; font-weight: 700; font-size: 17px; }
  .btn small { font-weight: 500; font-size: 13px; opacity: .85; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:active { filter: brightness(.92); }
  .btn.secondary { background: var(--soft); color: var(--accent); min-height: 46px; font-size: 16px; }
  .ch { display: flex; align-items: center; gap: 12px; padding: 13px 14px; width: 100%; text-align: start; }
  .ch + .ch { border-top: 1px solid var(--line); }
  .ch:active { background: var(--soft); }
  .ch .n { width: 26px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; flex: none; }
  .ch .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch.done .t { color: var(--muted); }
  .ch.now .t { color: var(--accent); font-weight: 650; }
  .ch .d { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; direction: ltr; }
  .save { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: 14.5px; font-weight: 600; padding: 6px 4px; }
  .save.muted { color: var(--muted); font-weight: 500; }
  .save .link { color: var(--accent); font-weight: 600; font-size: 14.5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .55; flex: none; }

  /* empty and sign-in states */
  .center { min-height: 70dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 0 12px; }
  .center h2 { margin: 0; font-size: 26px; }
  .center p { margin: 0; color: var(--muted); max-width: 340px; }
  .logo { width: 96px; height: 96px; border-radius: 24px; box-shadow: var(--shadow); }
  .note { font-size: 13px; color: var(--muted); }
  .err { color: var(--danger); font-size: 14px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--soft); padding: 1px 5px; border-radius: 5px; direction: ltr; unicode-bidi: isolate; }

  /* mini player */
  .mini { position: fixed; inset-inline: 8px; bottom: calc(8px + var(--bottom)); max-width: 624px; margin: 0 auto; z-index: 10;
    background: color-mix(in srgb, var(--card) 88%, transparent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 6px; overflow: hidden; }
  .mini[hidden] { display: none; }
  .mini .meta { flex: 1; min-width: 0; }
  .mini .t1 { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .t2 { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .line { position: absolute; bottom: 0; inset-inline: 0; height: 2px; background: var(--line); }
  .mini .line i { display: block; height: 100%; background: var(--accent); }
  .mini .ctl { width: 42px; height: 42px; display: grid; place-items: center; color: var(--ink); }

  /* full player */
  .player { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column;
    padding: calc(var(--top) + 6px) 24px calc(var(--bottom) + 18px); transform: translateY(100%); transition: transform .28s ease; }
  .player.open { transform: none; }
  .player .grab { align-self: center; width: 44px; height: 30px; display: grid; place-items: center; color: var(--muted); }
  .player .art { flex: 1; display: grid; place-items: center; min-height: 0; padding: 12px 0; }
  .player .art .cover { height: min(44dvh, 460px); max-width: 78vw; aspect-ratio: 2 / 3; border-radius: 14px; box-shadow: var(--shadow); }
  .player .names { text-align: center; }
  .player .names .t1 { font-size: 20px; font-weight: 750; line-height: 1.25; }
  .player .names .t2 { color: var(--muted); margin-top: 3px; }
  .player .names .t3 { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .status-line { text-align: center; font-size: 13px; color: var(--muted); min-height: 20px; margin-top: 6px; }
  .status-line.err { color: var(--danger); }
  .timeline { direction: ltr; margin-top: 8px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 99px; background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line) var(--p, 0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); margin-top: -5.5px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .times { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .controls { direction: ltr; display: flex; align-items: center; justify-content: space-between; margin: 14px 0 8px; }
  .controls button { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
  .controls button:active { background: var(--soft); }
  .controls .big { width: 78px; height: 78px; background: var(--accent); color: var(--accent-ink); }
  .controls .big:active { background: var(--accent); filter: brightness(.92); }
  .extras { display: flex; justify-content: center; gap: 12px; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .pill.on { background: var(--accent); color: var(--accent-ink); }
  .pill { direction: ltr; min-width: 64px; height: 34px; padding: 0 14px; border-radius: 99px; background: var(--soft); color: var(--accent); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }

  /* sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; display: flex; align-items: flex-end; }
  .sheet-bg[hidden] { display: none; }
  .sheet { width: 100%; max-width: 640px; margin: 0 auto; background: var(--card); border-radius: 18px 18px 0 0; padding: 10px 16px calc(var(--bottom) + 16px); }
  .sheet h3 { font-size: 16px; margin: 8px 4px 12px; }
  .sheet .opt { display: block; width: 100%; text-align: start; padding: 14px 6px; border-top: 1px solid var(--line); font-size: 16px; }
  .sheet .opt.danger { color: var(--danger); }
  .sheet .opt:first-of-type { border-top: 0; }
  .toast { position: fixed; left: 50%; bottom: calc(96px + var(--bottom)); transform: translateX(-50%); background: #1d1b18; color: #fff; padding: 10px 16px;
    border-radius: 12px; font-size: 14px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 88vw; text-align: center; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap" id="view"></div>

<div class="mini" id="mini" hidden>
  <div id="miniCover"></div>
  <div class="meta"><div class="t1" id="miniT1"></div><div class="t2" id="miniT2"></div></div>
  <button class="ctl" id="miniToggle" aria-label="נגן או עצור"></button>
  <button class="ctl" id="miniFwd" aria-label="קדימה 30 שניות"></button>
  <div class="line"><i id="miniLine"></i></div>
</div>

<section class="player" id="player" aria-hidden="true">
  <button class="grab" id="closePlayer" aria-label="סגור"></button>
  <div class="art" id="art"></div>
  <div class="names"><div class="t1" id="pT1"></div><div class="t2" id="pT2"></div><div class="t3" id="pT3"></div></div>
  <div class="status-line" id="pStatus"></div>
  <div class="timeline">
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="מיקום בפרק">
    <div class="times"><span id="tNow">0:00</span><span id="tLeft">-0:00</span></div>
  </div>
  <div class="controls">
    <button id="prevCh" aria-label="פרק קודם"></button>
    <button id="back" aria-label="אחורה 15 שניות"></button>
    <button id="toggle" class="big" aria-label="נגן או עצור"></button>
    <button id="fwd" aria-label="קדימה 30 שניות"></button>
    <button id="nextCh" aria-label="פרק הבא"></button>
  </div>
  <div class="extras"><button class="pill" id="rate" dir="ltr"><bdi>1×</bdi></button><button class="pill" id="sleep"></button><button class="pill" id="chapters">פרקים</button></div>
</section>

<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="auto"></audio>

<script>
// ---- configuration --------------------------------------------------------
// OAuth client of type "Web application" (see README). The ID is public.
const CLIENT_ID = '901133909012-bc4785dmgvdh855drndutssg8u8pgr0t.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.readonly';
const LIBRARY = 'ספרים מושמעים';
const RATES = [1, 1.1, 1.25, 1.5, 1.75, 2, 0.8];
const BACK_SEC = 15, FWD_SEC = 30;
const DEMO = new URLSearchParams(location.search).has('demo');
const CHAPTER_CACHE = 'chapters-v1';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); }
function clock(s) {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}
function hoursText(s) { const m = Math.round(s / 60); return m >= 60 ? `${Math.floor(m / 60)} ש׳ ${m % 60} ד׳` : `${m} ד׳`; }

// ---- icons ------------------------------------------------------------------
const I = {
  play: '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.1-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6z"/></svg>',
  pause: '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.3"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3"/></svg>',
  skip: (n, fwd) => `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="${fwd ? 'M12 6A7 7 0 1 0 19 13' : 'M12 6A7 7 0 1 1 5 13'}"/><path d="${fwd ? 'M9.6 3.6 12.3 6 9.6 8.4' : 'M14.4 3.6 11.7 6 14.4 8.4'}"/>
    <text x="12" y="15.4" fill="currentColor" stroke="none" font-size="6.6" font-weight="700" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif">${n}</text></svg>`,
  chapter: next => `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="${next ? 'transform:scaleX(-1)' : ''}"><rect x="5" y="6" width="2.2" height="12" rx="1"/><path d="M18.5 6.9v10.2a.9.9 0 0 1-1.4.74L9.8 12.74a.9.9 0 0 1 0-1.48l7.3-5.1a.9.9 0 0 1 1.4.74z"/></svg>`,
  down: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 5.5 6-5.5"/></svg>',
  backArrow: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.5l6.5 6.5L9 18.5"/></svg>',
  moon: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20.6 14.6A8.6 8.6 0 0 1 9.4 3.4a8.6 8.6 0 1 0 11.2 11.2z"/></svg>',
  save: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>',
  more: '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18.5" cy="12" r="2"/></svg>',
  smallPlay: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.1-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6z"/></svg>',
};
const miniIcon = svg => svg.replace(/width="30" height="30"/, 'width="24" height="24"');

// ---- covers ---------------------------------------------------------------------------
// A cover.jpg/png (or the only image) in the book's Drive folder is the book's art; it is
// cached on the device. Books without one get art drawn from the title, in stable colors.
const COVER_CACHE = 'covers-v1';
const coverURLs = new Map();  // book id -> object URL
async function loadCover(book) {
  if (!book.cover || coverURLs.has(book.id)) return false;
  const key = new Request(`cover/${book.cover.id}-${encodeURIComponent(book.cover.v || '')}`);
  const c = await caches.open(COVER_CACHE);
  let blob = await (await c.match(key))?.blob();
  if (!blob) {
    const r = DEMO ? await fetch(book.cover.url) : await drive(`files/${book.cover.id}`, { alt: 'media' });
    blob = await r.blob();
    await c.put(key, new Response(blob, { headers: { 'content-type': blob.type || 'image/jpeg' } }));
    // Drop older versions of the same cover.
    for (const k of await c.keys()) if (k.url.includes(`/cover/${book.cover.id}-`) && k.url !== key.url) await c.delete(k);
  }
  coverURLs.set(book.id, URL.createObjectURL(blob));
  return true;
}
async function loadCovers() {
  if (!library || !library.books) return;
  const got = await Promise.all(library.books.map(b => loadCover(b).catch(() => false)));
  if (got.some(Boolean)) { render(); if (P.book) { renderPlayer(); renderMini(); updateSession(); } }
}

function hue(title) { let h = 0; for (const ch of title) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h % 360; }
function coverStyle(title) { const h = hue(title); return `background: linear-gradient(145deg, hsl(${h} 45% 42%), hsl(${(h + 40) % 360} 55% 26%));`; }
// shape: 'book' (2:3, like a printed cover), 'square' (mini player), 'player' (sized by CSS).
function coverHTML(book, size, shape = 'book') {
  const dims = shape === 'player' ? '' : `width:${size}px;height:${shape === 'square' ? size : Math.round(size * 1.5)}px;`;
  const url = coverURLs.get(book.id);
  if (url) return `<div class="cover shape-${shape}" style="${dims}"><img src="${url}" alt=""></div>`;
  const small = size < 70;
  const text = small ? [...book.title.trim()][0] || '' : book.title;
  const fs = small ? size * 0.45 : Math.max(13, size * 0.11);
  return `<div class="cover shape-${shape}" style="${coverStyle(book.title)} ${dims} font-size:${fs}px"><span>${esc(text)}</span></div>`;
}
const artCache = new Map();
function coverBlobURL(book) {
  if (artCache.has(book.id)) return Promise.resolve(artCache.get(book.id));
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), h = hue(book.title);
  const grad = g.createLinearGradient(0, 0, 512, 512);
  grad.addColorStop(0, `hsl(${h} 45% 42%)`); grad.addColorStop(1, `hsl(${(h + 40) % 360} 55% 26%)`);
  g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
  g.fillStyle = '#fff'; g.font = '800 54px -apple-system, system-ui, sans-serif'; g.textAlign = 'center'; g.direction = 'rtl';
  const lines = []; let line = '';
  for (const w of book.title.split(/\s+/)) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > 420 && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  const shown = lines.slice(0, 5), y0 = 256 - (shown.length - 1) * 32;
  shown.forEach((l, i) => g.fillText(l, 256, y0 + i * 64 + 18));
  return new Promise(res => c.toBlob(b => { const u = URL.createObjectURL(b); artCache.set(book.id, u); res(u); }, 'image/png'));
}

// ---- Google sign-in (OAuth implicit redirect: works inside a home-screen web app) --------
let authError = '';
function token() { const t = store.get('token'); return t && t.exp > Date.now() + 60_000 ? t.value : null; }
function signIn(silent = false) {
  const state = Math.random().toString(36).slice(2);
  store.set('oauthState', state);
  const p = new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: location.origin + location.pathname, response_type: 'token',
    scope: SCOPE, include_granted_scopes: 'true', state });
  const email = store.get('email'); if (email) p.set('login_hint', email);
  if (silent) p.set('prompt', 'none');
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + p;
}
function takeTokenFromUrl() {
  if (!/access_token|error/.test(location.hash)) return;

      const done = p && (p.finished || i < p.index);
      return `<button class="ch ${now ? 'now' : done ? 'done' : ''}" data-ch="${i}">
        <span class="n">${i + 1}</span><span class="t">${esc(c.title)}</span>
        ${here.has(c.id) ? '<span class="dot" title="שמור במכשיר"></span>' : ''}
        <span class="d">${durations[c.id] ? clock(durations[c.id]) : ''}</span></button>`;
    }).join('')}</div>
    <div class="note" style="margin:10px 4px">נקודה ליד פרק: הוא שמור במכשיר וזמין גם בלי אינטרנט.</div>`;
}

// Whole book on the device, for a flight or a drive without reception.
const bookDownloads = new Map();  // book id -> { done, total, frac }
const saveText = d => `שומר במכשיר: פרק ${Math.min(d.done + 1, d.total)} מתוך ${d.total}${d.frac ? `, ${Math.round(d.frac * 100)}%` : ''}`;
function rerenderBook(b) { if (route.name === 'book' && route.id === b.id) renderBook(b); }
async function saveBook(b) {
  const here = await localIds();
  const missing = b.chapters.filter(c => !here.has(c.id));
  const need = missing.reduce((a, c) => a + (c.size || 0), 0);
  try {
    const e = await navigator.storage.estimate();
    if (e.quota && e.quota - (e.usage || 0) < need * 1.1) { toast('אין מספיק מקום פנוי במכשיר לספר הזה'); return; }
  } catch {}
  const d = { done: 0, total: missing.length, frac: 0 };
  bookDownloads.set(b.id, d); rerenderBook(b);
  for (const c of missing) {
    try {
      await downloadChapter(c, f => { d.frac = f; const el = document.getElementById('saveLine'); if (el) el.textContent = saveText(d); });
    } catch (e) {
      bookDownloads.delete(b.id); rerenderBook(b);
      if (e instanceof AuthError) showSignInAgain(); else toast('השמירה נעצרה. בדוק חיבור ונסה שוב.');
      return;
    }
    d.done++; d.frac = 0;
    const el = document.getElementById('saveLine'); if (el) el.textContent = saveText(d);
  }
  bookDownloads.delete(b.id); rerenderBook(b); toast('כל הספר שמור במכשיר');
}
async function unsaveBook(b) {
  const keep = P.book ? P.book.chapters[P.index].id : null;  // never pull the chapter that is playing
  const c = await caches.open(CHAPTER_CACHE);
  for (const ch of b.chapters) if (ch.id !== keep) await c.delete(chapterKey(ch.id));
  toast('הספר הוסר מהמכשיר'); rerenderBook(b);
}

function renderMini() {
  const m = $('#mini');
  if (!P.book) { m.hidden = true; return; }
  m.hidden = false;
  const ch = P.book.chapters[P.index];
  $('#miniCover').innerHTML = coverHTML(P.book, 46, 'square');
  $('#miniT1').textContent = ch.title;
  $('#miniT2').textContent = P.book.title;
  $('#miniFwd').innerHTML = I.skip(FWD_SEC, true).replace('width="34" height="34"', 'width="28" height="28"');
  renderControls();
}
function renderPlayer() {
  if (!P.book) return;
  const ch = P.book.chapters[P.index];
  $('#art').innerHTML = coverHTML(P.book, 300, 'player');
  $('#pT1').textContent = ch.title;
  $('#pT2').textContent = P.book.title;
  $('#pT3').textContent = `פרק ${P.index + 1} מתוך ${P.book.chapters.length}`;
  $('#rate').innerHTML = `<bdi>${rate}×</bdi>`;
  setStatus(P.status, P.statusErr);
  renderControls(); renderTime();
}
function renderControls() {
  const playing = !audio.paused && P.url && audio.src === P.url;
  $('#toggle').innerHTML = playing ? I.pause.replace(/30/g, '34') : I.play.replace(/30/g, '34');
  $('#miniToggle').innerHTML = miniIcon(playing ? I.pause : I.play);
}
let scrubbing = false;
function renderTime() {
  const d = P.url && audio.src === P.url && isFinite(audio.duration) ? audio.duration : (P.book && durations[P.book.chapters[P.index].id]) || 0;
  const t = P.url && audio.src === P.url ? audio.currentTime : P.startAt;
  const seek = $('#seek');
  if (!scrubbing) seek.value = d ? Math.round(t / d * 1000) : 0;
  const shown = scrubbing && d ? seek.value / 1000 * d : t;
  seek.style.setProperty('--p', (seek.value / 10) + '%');
  $('#tNow').textContent = clock(shown);
  $('#tLeft').textContent = '-' + clock(Math.max(0, d - shown));
  $('#miniLine').style.width = d ? (t / d * 100) + '%' : '0';
}
function openPlayer() { $('#player').classList.add('open'); $('#player').setAttribute('aria-hidden', 'false'); renderPlayer(); }
function closePlayer() { $('#player').classList.remove('open'); $('#player').setAttribute('aria-hidden', 'true'); }

function sheet(html) { $('#sheet').innerHTML = html; $('#sheetBg').hidden = false; }
function closeSheet() { $('#sheetBg').hidden = true; }
function showSignInAgain() {
  sheet(`<h3>החיבור ל-Google פג</h3><p class="note" style="margin:0 4px 10px">כדי להוריד פרקים חדשים צריך להתחבר שוב. פרקים שכבר במכשיר ממשיכים לעבוד.</p>
    <button class="opt" data-act="signin">התחבר שוב</button><button class="opt" data-act="close">לא עכשיו</button>`);
}
async function showMenu() {
  let used = '';
  try { const e = await navigator.storage.estimate(); used = `${Math.round((e.usage || 0) / 1e6)} MB`; } catch {}
  sheet(`<h3>${esc(store.get('email', '') || 'ספרים מושמעים')}</h3>
    <button class="opt" data-act="refresh">רענן את הספרייה</button>
    <button class="opt" data-act="clear">מחק פרקים שמורים מהמכשיר${used ? ` (${used})` : ''}</button>
    ${DEMO ? '' : '<button class="opt danger" data-act="signout">התנתק</button>'}
    <button class="opt" data-act="close">סגור</button>`);
}
function showChapters() {
  const b = P.book; if (!b) return;
  sheet(`<h3>${esc(b.title)}</h3><div style="max-height:60dvh;overflow:auto">${b.chapters.map((c, i) =>
    `<button class="opt" data-pch="${i}" style="${i === P.index ? 'color:var(--accent);font-weight:700' : ''}">${i + 1}. ${esc(c.title)}</button>`).join('')}</div>`);
}

// ---- events -------------------------------------------------------------------------
function go(r) { route = r; history.pushState(r, ''); render(); window.scrollTo(0, 0); }
window.addEventListener('popstate', e => { route = e.state || { name: 'library' }; render(); });

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-book],[data-quick],[data-play],[data-start],[data-ch],[data-pch],[data-sleep],[data-save],[data-unsave]');
  if (!t) return;
  const find = id => library.books.find(b => b.id === id);
  if (t.dataset.quick) { e.stopPropagation(); playBook(find(t.dataset.quick)); openPlayer(); return; }
  if (t.dataset.book) return go({ name: 'book', id: t.dataset.book });
  if (t.dataset.play) { playBook(find(t.dataset.play)); openPlayer(); return; }
  if (t.dataset.start) { playBook(find(t.dataset.start), true); openPlayer(); return; }
  if (t.dataset.ch) { playChapter(find(route.id), +t.dataset.ch); openPlayer(); return; }
  if (t.dataset.pch) { closeSheet(); unlock(); openChapter(P.book, +t.dataset.pch, 0); return; }
  if (t.dataset.sleep != null) { closeSheet(); setSleep(t.dataset.sleep); return; }
  if (t.dataset.save) return saveBook(find(t.dataset.save));
  if (t.dataset.unsave) return unsaveBook(find(t.dataset.unsave));
  const act = t.dataset.act;
  if (act === 'signin') return signIn();
  if (act === 'home') return history.length > 1 ? history.back() : go({ name: 'library' });
  if (act === 'menu') return showMenu();
  if (act === 'close') return closeSheet();
  if (act === 'refresh') { closeSheet(); await refreshLibrary(true); return; }
  if (act === 'signout') { closeSheet(); signOut(); return; }
  if (act === 'clear') {
    closeSheet();
    const keep = P.book ? P.book.chapters[P.index].id : null;
    const c = await caches.open(CHAPTER_CACHE);
    for (const r of await c.keys()) if (!keep || !r.url.endsWith('/' + keep)) await c.delete(r);
    toast('הפרקים השמורים נמחקו'); render();
  }
});
$('#sheetBg').addEventListener('click', e => { if (e.target === $('#sheetBg')) closeSheet(); });
$('#mini').addEventListener('click', e => { if (!e.target.closest('button')) openPlayer(); });
$('#miniToggle').onclick = () => toggle();
$('#miniFwd').onclick = () => skip(FWD_SEC);
$('#closePlayer').onclick = closePlayer;
$('#toggle').onclick = () => toggle();
$('#back').onclick = () => skip(-BACK_SEC);
$('#fwd').onclick = () => skip(FWD_SEC);
$('#prevCh').onclick = prevChapter;
$('#nextCh').onclick = nextChapter;
$('#rate').onclick = () => setRate(RATES[(RATES.indexOf(rate) + 1) % RATES.length]);
$('#chapters').onclick = showChapters;
$('#sleep').onclick = showSleep;
renderSleep();
const seekEl = $('#seek');
seekEl.addEventListener('input', () => { scrubbing = true; renderTime(); });
seekEl.addEventListener('change', () => {
  scrubbing = false;
  if (P.url && isFinite(audio.duration)) { audio.currentTime = seekEl.value / 1000 * audio.duration; saveProgress(); updatePosition(); }
  renderTime();
});
// Swipe down on the player to close it.
let y0 = null;
$('#player').addEventListener('touchstart', e => { y0 = e.target.closest('input') ? null : e.touches[0].clientY; }, { passive: true });
$('#player').addEventListener('touchend', e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 90) closePlayer(); y0 = null; });

$('#closePlayer').innerHTML = I.down;
$('#back').innerHTML = I.skip(BACK_SEC, false);
$('#fwd').innerHTML = I.skip(FWD_SEC, true);
$('#prevCh').innerHTML = I.chapter(false);
$('#nextCh').innerHTML = I.chapter(true);

// ---- start --------------------------------------------------------------------------
async function refreshLibrary(announce) {
  try {
    const lib = await fetchLibrary();
    library = lib; loadError = '';
    for (const b of lib.books || []) for (const c of b.chapters) if (c.seconds && !durations[c.id]) durations[c.id] = c.seconds;
    store.set('durations', durations);
    if (!DEMO) store.set('library', lib);
    loadCovers();
    if (announce) toast('הספרייה עודכנה');
  } catch (e) {
    if (e instanceof AuthError) { if (!library) { render(); return; } loadError = 'לא מחובר ל-Google. מוצגת הספרייה מהפעם הקודמת.'; }
    else loadError = library ? 'אין חיבור. מוצגת הספרייה מהפעם הקודמת.' : 'טעינת הספרייה נכשלה. בדוק חיבור.';
  }
  render();
}

takeTokenFromUrl();
history.replaceState(route, '');
if ('serviceWorker' in navigator && !DEMO) navigator.serviceWorker.register('sw.js').catch(() => {});
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
// An expired session renews itself with one quick redirect when the app opens, never mid-listening.
if (!DEMO && CLIENT_ID && !token() && store.get('signedIn') && !sessionStorage.getItem('silentTried')) {
  sessionStorage.setItem('silentTried', '1');
  signIn(true);
} else {
  render();
  loadCovers();  // covers saved on the device show at once, even offline
  if (DEMO || token()) refreshLibrary(false);
}
</script>
</body>
